[package]
name = "hello_world"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4"
rfd = "0.17"
md-5 = "0.10"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }
