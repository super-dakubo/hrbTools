<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRB Tools</title>
    <link rel="stylesheet" href="styles.css">
    <script>window.__configPromise = window.__TAURI_INTERNALS__.invoke('get_config', {}).catch(function(){ return null; });</script>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载...</div>
</div>
<div class="container">

    <!-- 自定义标题栏 -->
    <div class="title-bar">
        <span class="title-bar-text">HRB Tools</span>
        <span class="title-bar-spacer"></span>
        <button class="title-bar-btn" id="settingsBtn" title="设置">&#9881;</button>
        <button class="title-bar-btn" id="minimizeBtn" title="最小化">&#x2014;</button>
        <button class="title-bar-btn" id="maximizeBtn" title="最大化">&#x25A1;</button>
        <button class="title-bar-btn title-bar-close" id="closeBtn" title="关闭">&#x2715;</button>
    </div>

    <!-- 提醒横幅区（标题栏下方，不遮盖内容） -->
    <div class="banner-area" id="bannerArea"></div>

    <div class="body-area">

        <!-- 左侧 Tab 栏 -->
        <div class="tab-bar" id="tabBar">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 右侧内容区 -->
        <div class="content">

        <!-- 时间转换面板 -->
        <div class="panel active" id="panel-convert">
            <div class="timezone-sets" id="timezoneSets">
                <!-- 动态生成 .tz-set -->
            </div>
            <button class="tz-add-btn" id="addTimezoneBtn">+ 新增时区</button>
            <div id="startupTiming" style="margin-top:8px;font-size:0.7rem;color:var(--text-dim,#888);text-align:center;"></div>
        </div>

        <!-- 存档管理面板 -->
        <div class="panel" id="panel-backup">
            <h1>游戏存档备份</h1>

            <!-- 第一层：游戏标签 -->
            <div class="game-tabs" id="gameTabs">
                <!-- 动态生成 .game-tab + .game-tab-add -->
            </div>

            <!-- 第二层：存档位标签 -->
            <div class="slot-tabs" id="slotTabs">
                <!-- 动态生成 .slot-tag + .slot-tag-add -->
            </div>

            <!-- 存档文件 -->
            <div class="input-group">
                <label>存档文件</label>
                <div class="file-tags" id="fileTags">
                    <!-- 动态生成 .file-tag + .file-tag-add -->
                </div>
                <div class="row" style="margin-top:6px;">
                    <button id="browseFileBtn" class="btn-small">浏览添加</button>
                    <button id="rehashBtn" class="btn-small" title="重算所有文件哈希">重算</button>
                </div>
            </div>

            <button id="saveBackupBtn">保存存档</button>

            <div id="backupError" class="error"></div>
            <div id="backupSuccess" class="success"></div>

            <!-- 备份列表 -->
            <div class="backup-list-section">
                <h3 id="backupListTitle">备份记录</h3>
                <div id="backupList" class="backup-list">
                    <div class="empty-hint">请先选择游戏和存档位</div>
                </div>
            </div>
        </div>

        <!-- 待办面板 -->
        <div class="panel" id="panel-todo">
            <div class="todo-toolbar">
                <input type="text" id="todoSearch" class="todo-search-input" placeholder="🔍 搜索待办...">
                <select id="todoFilterStatus" class="todo-filter-select">
                    <option value="all">全部</option>
                    <option value="active">待完成</option>
                    <option value="done">已完成</option>
                </select>
                <select id="todoFilterPriority" class="todo-filter-select">
                    <option value="-1">全部优先级</option>
                    <option value="2">高</option>
                    <option value="1">中</option>
                    <option value="0">低</option>
                </select>
            </div>
            <div class="todo-stats" id="todoStats"></div>
            <div class="todo-list" id="todoList">
                <div class="empty-hint">暂无待办，在下方添加</div>
            </div>
            <div class="todo-add-bar">
                <button id="todoAddBtn">+ 添加待办</button>
            </div>
        </div>

        <!-- 日志面板 -->
        <div class="panel" id="panel-log">
            <div class="log-toolbar">
                <input type="text" id="logSearch" class="log-search-input" placeholder="&#128269; 搜索日志...">
                <select id="logLevelFilter" class="log-filter-select">
                    <option value="ALL">全部</option>
                    <option value="ERROR">ERROR</option>
                    <option value="WARN">WARN</option>
                    <option value="PERF">PERF</option>
                    <option value="INFO">INFO</option>
                    <option value="DEBUG">DEBUG</option>
                </select>
                <button id="logOpenDirBtn" class="btn-small">打开日志目录</button>
                <button id="logClearBtn" class="btn-small">清屏</button>
            </div>
            <div id="logEntries" class="log-entries">
                <div class="empty-hint">暂无日志</div>
            </div>
        </div>

        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsOverlay" style="display:none">
        <div class="modal" id="settingsModal">
            <div class="modal-header">
                <span class="modal-title">&#9881; 设置</span>
                <button class="modal-close" id="settingsCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>备份根目录</label>
                    <div class="row">
                        <span id="settingsBackupRoot" class="path-hint">未设置</span>
                        <button id="settingsSetDirBtn" class="btn-small">更改</button>
                        <button id="settingsOpenDirBtn" class="btn-small">打开</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>主题模式</label>
                    <button id="themeToggleBtn" class="btn-small" style="width:100%">🌙 暗色模式</button>
                </div>
                <div class="input-group">
                    <div class="row" style="justify-content:space-between;margin-top:12px;">
                        <label style="margin:0;">开机自启</label>
                        <button class="btn-small" id="autoStartToggle" style="width:auto;">关闭</button>
                    </div>
                    <div class="row" style="justify-content:space-between;margin-top:8px;">
                        <label style="margin:0;">最小化到托盘</label>
                        <button class="btn-small" id="trayToggle" style="width:auto;">开启</button>
                    </div>
                    <div class="row" style="justify-content:space-between;margin-top:8px;">
                        <label style="margin:0;">启用提醒</label>
                        <button class="btn-small" id="reminderToggle" style="width:auto;">开启</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>节假日配置</label>
                    <div id="holidayYearsList"></div>
                    <div class="row" style="margin-top:8px;">
                        <select id="holidayYearSelect" class="holiday-year-select">
                            <option value="2026">2026年</option>
                            <option value="2027">2027年</option>
                        </select>
                        <button id="holidayAddBtn" class="btn-small">添加</button>
                    </div>
                    <div id="holidayEditor" style="display:none;margin-top:8px;"></div>
                </div>
                <div class="settings-hint">更多设置项将陆续添加</div>
            </div>
        </div>
    </div>

</div>

<script src="main.js"></script>
</body>
</html>
